<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>لوح تقدیر</title>

<style>

body{
margin:0;
padding:0;
background:white;
text-align:center;
font-family:tahoma;
}

.certificate{
position:relative;
width:794px;
height:1123px;
margin:auto;
}

.certificate-bg{
width:100%;
height:100%;
display:block;
}

.name{
position:absolute;
top:420px;
left:0;
right:0;
font-size:42px;
font-weight:bold;
color:#5b2c06;
text-align:center;
}

</style>

</head>

<body>

<div class="certificate">

<img src="images/certificate-new.png" class="certificate-bg" alt="لوح تقدیر">

<div class="name" id="studentName"></div>

</div>

<script>

let name = localStorage.getItem("certificate_name");

document.getElementById("studentName").textContent = name || "";

</script>

</body>

</html>
