<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>لوح تقدیر</title>

<style>

body{
margin:0;
padding:0;
background:white;
text-align:center;
font-family:tahoma;
}

.certificate{
position:relative;
width:794px;
height:1123px;
margin:auto;
}

.certificate-bg{
width:100%;
height:100%;
display:block;
}

.name{
position:absolute;
top:385px;
left:0;
right:0;

text-align:center;

font-size:52px;
font-weight:900;

color:#0D47A1;

text-shadow:
1px 1px 0 #FFFFFF,
2px 2px 4px rgba(0,0,0,0.25);

letter-spacing:1px;
}

</style>

</head>

<body>

<div class="certificate">

<img src="images/certificate-new.png" class="certificate-bg" alt="لوح تقدیر">

<div class="name" id="studentName"></div>

</div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>

let name = localStorage.getItem("certificate_name");

document.getElementById("studentName").textContent = name || "";

function downloadCertificate(){

html2canvas(document.querySelector(".certificate")).then(function(canvas){

let link=document.createElement("a");

link.download="لوح تقدیر.png";

link.href=canvas.toDataURL("image/png");

link.click();

});

}

</script>

</body>

</html>
