<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>راهنمای بازی</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    padding: 5px;
    box-sizing: border-box;
    min-height: 100vh;
    overflow: hidden;
    background: #fff;
}


.guide-page {

    width: 100%;
    height: 100vh;

    display: flex;
    flex-direction: column;
    align-items: center;

    justify-content: flex-start;

    box-sizing: border-box;
}


.guide-image {

    width: auto;
    max-width: 100%;

    max-height: calc(100vh - 90px);

    object-fit: contain;

    display: block;

}



.guide-page button {

    position: fixed;

    bottom: 12px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 1000;


    padding: 10px 35px;

    font-size: 18px;

    font-weight: bold;

    border: none;

    border-radius: 12px;

    cursor: pointer;

}



@media(max-width:600px){

    .guide-image{

        max-width:100%;

        max-height:calc(100vh - 90px);

    }


    .guide-page button{

        bottom:10px;

        padding:8px 30px;

        font-size:17px;

    }

}


</style>

</head>


<body>


<div class="guide-page">


    <img src="images/guide-page.png"
         class="guide-image"
         alt="راهنمای بازی جدول ضرب">



    <button onclick="history.back()">
        بازگشت
    </button>


</div>


</body>

</html>
