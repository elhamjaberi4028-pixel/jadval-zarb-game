<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>لوح تقدیر</title>

<style>

body{
margin:0;
padding:20px;
background:white;
text-align:center;
font-family:tahoma;
}

canvas{
    max-width:100%;
    height:auto;
    display:block;
    margin:auto;
}

.download-btn{
margin-top:20px;
padding:12px 30px;
font-size:22px;
background:#4CAF50;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
font-family:tahoma;
}

</style>

</head>

<body>


<canvas id="certificateCanvas"
width="794"
height="1123">
</canvas>


<br>

<button class="download-btn" onclick="downloadCertificate()">
📥 دانلود لوح تقدیر
</button>



<script>

let name = localStorage.getItem("certificate_name") || "دانش‌آموز";


let canvas = document.getElementById("certificateCanvas");
let ctx = canvas.getContext("2d");


let img = new Image();

img.src="images/certificate-new.png";


img.onload=function(){


    // قرار دادن تصویر لوح
    ctx.drawImage(img,0,0,794,1123);



    // تنظیم متن فارسی
    ctx.direction="rtl";
    ctx.textAlign="center";
    ctx.font="900 52px Tahoma";


    // سایه متن
    ctx.shadowColor="rgba(0,0,0,0.25)";
    ctx.shadowBlur=4;
    ctx.shadowOffsetX=2;
    ctx.shadowOffsetY=2;


    ctx.fillStyle="#0D47A1";


    // نوشتن نام
ctx.fillText(name,397,445);


    // حذف سایه برای ادامه
    ctx.shadowColor="transparent";


};



function downloadCertificate(){


let link=document.createElement("a");


link.download="لوح-تقدیر-"+name+".png";


link.href=canvas.toDataURL("image/png");


link.click();


}


</script>


</body>
</html>
