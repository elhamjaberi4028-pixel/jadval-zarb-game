<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<title>لوح تقدیر</title>

<style>

body{
margin:0;
padding:0;
background:white;
text-align:center;
font-family:tahoma;
}


.certificate{

position:relative;
width:794px;
height:1123px;
margin:auto;

}


.certificate-bg{

width:100%;
height:100%;
display:block;

}



.title{

position:absolute;
top:300px;
left:0;
right:0;

font-size:55px;
font-weight:bold;
color:#b8860b;

}



.name{

position:absolute;
top:450px;
left:0;
right:0;

font-size:42px;
font-weight:bold;
color:#5b2c06;

}



.text{

position:absolute;
top:520px;
left:70px;
right:70px;

font-size:28px;
line-height:2;
color:#333;

}



.footer{

position:absolute;
bottom:120px;
left:0;
right:0;

font-size:25px;
color:#5b2c06;

}


</style>

</head>


<body>


<div class="certificate">


<img src="images/certificate.png" class="certificate-bg">


<div class="title">
📜 لوح تقدیر
</div>


<div class="name" id="studentName"></div>



<div class="text">

این لوح تقدیر به پاس تلاش، پشتکار و موفقیت ارزشمند<br>
در یادگیری جدول ضرب و کسب سه مدال طلای قهرمانی<br>
به دانش‌آموز عزیز تقدیم می‌گردد.<br><br>

باشد که با ادامه تلاش، علاقه و کوشش بیشتر،<br>
در مسیر یادگیری و پیشرفت همواره موفق و سربلند باشد.

</div>



<div class="footer">

طراحی: مرضیه جابری

</div>


</div>



<script>

let name = localStorage.getItem("certificate_name");

document.getElementById("studentName").innerHTML = name || "";




</script>


</body>

</html>
